<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#0B2233;overflow:hidden}
canvas{display:block}
</style></head><body><canvas id="c" width="800" height="1040"></canvas>
<script>
// A drop a third full: the month's 35%. Waves move; drawn for the cover, recorded to MP4 frame by frame (../build.py).
const c = document.getElementById('c'), x = c.getContext('2d'), W = 800, H = 1040;
const drop = new Path2D('M400 60 C 400 60 120 470 120 680 a280 280 0 0 0 560 0 C680 470 400 60 400 60Z');
const level = H - 120 - (H - 180) * 0.35;  // the water line at 35%
function frame(t) {
  x.clearRect(0, 0, W, H);
  x.fillStyle = '#0B2233'; x.fillRect(0, 0, W, H);
  x.save(); x.clip(drop);
  x.fillStyle = '#133A55'; x.fillRect(0, 0, W, H);
  for (const [amp, len, speed, col, off] of [[16, 340, 0.0011, '#2F7FD0', 0], [11, 260, -0.0016, '#5FA8E8', 18]]) {
    x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= W; px += 8) x.lineTo(px, level + off + Math.sin(px / len * Math.PI * 2 + t * speed * 6) * amp);
    x.lineTo(W, H); x.closePath(); x.fillStyle = col; x.fill();
  }
  x.restore();
  x.lineWidth = 3; x.strokeStyle = 'rgba(220,235,247,.55)'; x.stroke(drop);
  x.beginPath(); x.ellipse(290, 560, 22, 70, -0.35, 0, Math.PI * 2); x.fillStyle = 'rgba(255,255,255,.18)'; x.fill();
}
// Live in a browser it plays by itself; a recorder calls drawAt(ms) for each frame instead (../build.py)
window.drawAt = frame;
if (!location.search.includes('record')) (function loop(t) { frame(t); requestAnimationFrame(loop); })(0);
</script></body></html>
