[package]
name = "kb-skills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = true

[lints]
workspace = true

[dependencies]
kb-base = { workspace = true }
kb-db = { workspace = true }
kb-files = { workspace = true }
kb-doctext = { workspace = true }
kb-board = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# the programs the tests start instead of Claude Code and an MCP server (no Python needed)
[[bin]]
name = "fake-mcp-server"
path = "tests/support/fake_mcp_server.rs"
test = false

[[bin]]
name = "fake-claude-cli"
path = "tests/support/fake_claude_cli.rs"
test = false

[dev-dependencies]
testkit = { workspace = true }
tempfile = "3"
sha2 = "0.10"
tower = { workspace = true }
async-trait = { workspace = true }
# the same sqlx as testkit and the entities: two versions of libsqlite3-sys cannot link together
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
