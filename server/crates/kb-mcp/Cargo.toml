[package]
name = "kb-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kb-base = { workspace = true }
kb-db = { workspace = true }
kb-board = { workspace = true }
kb-skills = { workspace = true }
kb-files = { workspace = true }
kb-docs = { workspace = true }
kb-doctext = { workspace = true }
kb-draw = { workspace = true }
kb-ai = { workspace = true }
kb-ai-know = { workspace = true }
kb-ai-run = { workspace = true }
kb-assist = { workspace = true }
kb-ideas = { workspace = true }
kb-notify = { workspace = true }
kb-log = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = "0.10"
tempfile = "3"

# the server the tests of this crate start through `testkit`: the MCP routes alone over a temporary database
[[bin]]
name = "kb-mcp-test-server"
path = "tests/support/test_server.rs"
test = false

[dev-dependencies]
testkit = { workspace = true }
flate2 = "1"
fake-claude = { path = "../fake-claude" }
# the same sqlx as testkit: a test adds the rows of an AI run to the server's SQLite file
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
