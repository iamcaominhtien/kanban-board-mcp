[package]
name = "kb-ai-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kb-base = { workspace = true }
kb-db = { workspace = true }
kb-ai = { workspace = true }
kb-ai-know = { workspace = true }
kb-ai-work = { workspace = true }
kb-board = { workspace = true }
kb-draw = { workspace = true }
kb-notify = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
jiff = { workspace = true }
portable-pty = "0.9"
regex = { workspace = true }
# the runner process posts the board's events to the API (`runner/main.py`'s httpx client)
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs"] }

[dev-dependencies]
chrono-tz = { workspace = true }
fake-claude = { path = "../fake-claude" }
axum = { workspace = true }
sha2 = "0.10"
tower = { workspace = true }
