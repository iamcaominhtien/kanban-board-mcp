<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box} html,body{margin:0;background:#0F1A13;overflow:hidden;font-family:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif}
#view{position:absolute;left:0;top:0;width:__W__px;height:__VH__px;overflow:hidden;background:#fff}
#cam{position:absolute;left:0;top:0;width:__W__px;height:__VH__px;transform-origin:0 0;transition:transform 1s cubic-bezier(.45,0,.2,1)}
#app{width:__W__px;height:__VH__px;border:0;display:block}
#spot{position:absolute;left:0;top:0;width:0;height:0;border-radius:14px;pointer-events:none;opacity:0;
  box-shadow:0 0 0 2400px rgba(12,20,15,.58),0 0 0 3px #5FBF7F inset;transition:all .6s cubic-bezier(.45,0,.2,1)}
#cursor{position:absolute;left:0;top:0;width:40px;height:40px;transform-origin:13px 3px;pointer-events:none;transform:translate(-80px,-80px);transition:transform .7s cubic-bezier(.4,0,.2,1);z-index:5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
#ripple{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;border:3px solid #2E6F40;pointer-events:none;opacity:0;z-index:4}
#band{position:absolute;left:0;top:__VH__px;width:__W__px;height:__BAND__px;background:#1E2A22;display:flex;align-items:center;justify-content:center}
#cap{color:#fff;font-weight:600;font-size:24px;line-height:1.3;text-align:center;padding:0 48px;opacity:0;transition:opacity .35s}
#prog{position:absolute;left:0;bottom:0;height:4px;width:0;background:linear-gradient(90deg,#5FBF7F,#2E6F40)}
#wipe{position:absolute;inset:0;background:linear-gradient(120deg,#1E2A22,#2E6F40);transform:translateX(-101%);z-index:20;display:flex;align-items:center;justify-content:center}
#banner{position:absolute;inset:0;z-index:30;background:radial-gradient(1200px 700px at 30% 20%,#2E6F40 0,#1E2A22 55%,#0F1A13 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.logo{width:116px;height:116px;border-radius:28px;background:#2E6F40;box-shadow:0 18px 50px rgba(0,0,0,.35);display:flex;gap:9px;align-items:flex-end;justify-content:center;padding:26px 24px;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.logo i{display:block;width:18px;border-radius:5px;background:#fff;animation:grow .9s .3s cubic-bezier(.2,1,.3,1) both}
.logo i:nth-child(1){height:34px}.logo i:nth-child(2){height:58px;background:#CFE8D5}.logo i:nth-child(3){height:44px}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.bt{font-size:64px;font-weight:800;letter-spacing:-1.5px;margin-top:30px;animation:rise .9s .35s both}
.bs{font-size:25px;font-weight:500;color:#CFE8D5;margin-top:12px;animation:rise .9s .6s both;text-align:center;max-width:900px}
.chips{display:flex;gap:12px;margin-top:34px;animation:rise .9s .9s both}
.chip{padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:600;font-size:18px;border:1px solid rgba(255,255,255,.2)}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#outro{position:absolute;inset:0;z-index:25;background:radial-gradient(1200px 700px at 70% 80%,#2E6F40 0,#1E2A22 60%,#0F1A13 100%);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;opacity:0}
#banner,#wipe,#outro{pointer-events:none}
</style></head><body>
<div id="view"><div id="cam"><iframe id="app" src="__BASE__"></iframe></div><div id="spot"></div>
<svg id="cursor" viewBox="0 0 24 24" fill="#fff" stroke="#1E2A22" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/><path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10"/><path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"/><path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/></svg><div id="ripple"></div></div>
<div id="band"><div id="cap"></div><div id="prog"></div></div>
<div id="wipe"></div>
<div id="outro"><div class="logo"><i></i><i></i><i></i></div><div class="bt">__OUTRO_TITLE__</div><div class="bs">__OUTRO_TAGLINE__</div></div>
<div id="banner"><div class="logo"><i></i><i></i><i></i></div><div class="bt">__TITLE__</div>
<div class="bs">__SUBTITLE__</div>
<div class="chips">__CHIPS__</div></div>
<script>
const cam={x:0,y:0,s:1}, W=__W__, VH=__VH__;
const $=id=>document.getElementById(id);
window.__cam=(cx,cy,s,ms)=>{let tx=W/2-cx*s,ty=VH/2-cy*s;tx=Math.min(0,Math.max(W-W*s,tx));ty=Math.min(0,Math.max(VH-VH*s,ty));
  cam.x=tx;cam.y=ty;cam.s=s;const e=$('cam');e.style.transitionDuration=ms+'ms';e.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;};
window.__toStage=(x,y)=>[cam.x+x*cam.s,cam.y+y*cam.s];
window.__cursor=(x,y)=>{$('cursor').style.transform=`translate(${x}px,${y}px)`;};
window.__ripple=(x,y)=>{$('cursor').animate([{scale:'1'},{scale:'.8'},{scale:'1'}],{duration:240,easing:'ease-out'});const r=$('ripple');r.style.left=x+'px';r.style.top=y+'px';r.animate([{opacity:.9,transform:'scale(.4)'},{opacity:0,transform:'scale(3.2)'}],{duration:550,easing:'ease-out'});};
window.__spot=(x,y,w,h,pad)=>{const s=$('spot');if(x==null){s.style.opacity=0;return;}
  const a=__toStage(x,y),b=__toStage(x+w,y+h);s.style.opacity=1;s.style.left=(a[0]-pad)+'px';s.style.top=(a[1]-pad)+'px';s.style.width=(b[0]-a[0]+2*pad)+'px';s.style.height=(b[1]-a[1]+2*pad)+'px';};
window.__cap=t=>{const c=$('cap');if(!t){c.style.opacity=0;return;}c.style.opacity=0;setTimeout(()=>{c.textContent=t;c.style.opacity=1;},180);};
window.__prog=(f,ms)=>{const p=$('prog');p.style.transition='width '+ms+'ms linear';p.style.width=(f*100)+'%';};
window.__bannerOut=ms=>$('banner').animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.08)'}],{duration:ms,fill:'forwards',easing:'ease-in'});
window.__wipe=ms=>$('wipe').animate([{transform:'translateX(-101%)'},{transform:'translateX(0)',offset:.5},{transform:'translateX(101%)'}],{duration:ms,easing:'cubic-bezier(.6,0,.3,1)'});
window.__outro=ms=>{const o=$('outro');o.style.display='flex';o.animate([{opacity:0},{opacity:1}],{duration:ms,fill:'forwards'});};
</script></body></html>
