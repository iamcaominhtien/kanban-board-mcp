[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "5.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
kb-base = { path = "crates/kb-base" }
kb-db = { path = "crates/kb-db" }
kb-files = { path = "crates/kb-files" }
kb-fuzzy = { path = "crates/kb-fuzzy" }
kb-log = { path = "crates/kb-log" }
kb-notify = { path = "crates/kb-notify" }
kb-doctext = { path = "crates/kb-doctext" }
kb-draw = { path = "crates/kb-draw" }
kb-docs = { path = "crates/kb-docs" }
kb-board = { path = "crates/kb-board" }
kb-ideas = { path = "crates/kb-ideas" }
kb-skills = { path = "crates/kb-skills" }
kb-ai = { path = "crates/kb-ai" }
kb-assist = { path = "crates/kb-assist" }
kb-dbkit = { path = "crates/kb-dbkit" }
kb-mcp = { path = "crates/kb-mcp" }
kb-app = { path = "crates/kb-app" }
testkit = { path = "crates/testkit" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
futures = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
sea-orm = { version = "2.0", default-features = false, features = ["macros", "with-json", "sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls", "sqlite-use-returning-for-3_35"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# ports keep the shape of the Python code they come from, so the two read side by side
collapsible_if = "allow"
collapsible_else_if = "allow"
# ApiError carries the JSON detail of the answer
result_large_err = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
# no debug info: each test binary links the whole server, and the build folders fill the disk otherwise
debug = false
incremental = false

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
