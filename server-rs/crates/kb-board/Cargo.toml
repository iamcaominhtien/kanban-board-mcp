[package]
name = "kb-board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kb-base = { workspace = true }
kb-db = { workspace = true }
kb-doctext = { workspace = true }
kb-files = { workspace = true }
kb-log = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
testkit = { workspace = true }
# the same sqlx as testkit: tests add rows to the server's SQLite file where no ported route can
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
