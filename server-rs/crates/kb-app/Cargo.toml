[package]
name = "kb-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kb-base = { workspace = true }
kb-db = { workspace = true }
kb-doctext = { workspace = true }
async-trait = { workspace = true }
kb-log = { path = "../kb-log" }
kb-files = { path = "../kb-files" }
axum = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
kb-board = { workspace = true }
kb-skills = { workspace = true }
kb-notify = { workspace = true }
kb-docs = { workspace = true }
kb-draw = { workspace = true }
kb-ideas = { workspace = true }
kb-ai = { workspace = true }
kb-assist = { workspace = true }
kb-dbkit = { workspace = true }

[dev-dependencies]
testkit = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
tempfile = "3"
# another process writes to the server's SQLite file (the same sqlx the testkit uses)
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
