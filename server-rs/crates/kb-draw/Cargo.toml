[package]
name = "kb-draw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kb-base = { workspace = true }
kb-db = { workspace = true }
kb-doctext = { workspace = true }
kb-files = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# the raw deflate of a compressed draw.io page (zlib.decompress(data, -15))
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# a hidden Chrome is driven over the DevTools protocol on a WebSocket
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tempfile = "3"
caseless = "0.2.2"
serde_urlencoded = "0.7"

[dev-dependencies]
reqwest = { workspace = true }
testkit = { workspace = true }
# the same sqlx as testkit: tests add rows to the server's SQLite file where no ported route can
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
