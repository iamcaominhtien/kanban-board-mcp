# SonarQube Cloud analysis, run by the `sonar` job in .github/workflows/ci.yml.
# The keys are the ones SonarQube Cloud generates when the GitHub repository is imported.
sonar.organization=iamcaominhtien
sonar.projectKey=iamcaominhtien_kanban-board-mcp
sonar.projectName=Kanban Board MCP

# What is analysed: the Python server, the React UI and the Electron shell.
# design/ and docs/ (mockups, specs, the user guide) are left out.
sonar.sources=server,ui/src,desktop
sonar.tests=server/tests,ui/src,desktop/tests
sonar.exclusions=server/tests/**,server/uploads/**,desktop/tests/**,desktop/build/**,ui/src/**/*.test.ts,ui/src/**/*.test.tsx,**/node_modules/**,**/.venv/**
sonar.test.inclusions=server/tests/**,ui/src/**/*.test.ts,ui/src/**/*.test.tsx,desktop/tests/**

sonar.python.version=3.12

# Coverage reports made by the backend, frontend and desktop jobs (paths made repo-relative by the sonar job)
sonar.python.coverage.reportPaths=coverage-reports/coverage-server/coverage.xml
sonar.javascript.lcov.reportPaths=coverage-reports/coverage-ui/lcov.info,coverage-reports/coverage-desktop/lcov.info

# Alembic migrations are generated, one-off code: no coverage or duplication checks on them
sonar.coverage.exclusions=server/alembic/**,server/scripts/**
sonar.cpd.exclusions=server/alembic/**
