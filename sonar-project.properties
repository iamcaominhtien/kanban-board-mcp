# SonarQube Cloud analysis, run by the `sonar` job in .github/workflows/ci.yml.
# The keys are the ones SonarQube Cloud generates when the GitHub repository is imported.
sonar.organization=iamcaominhtien
sonar.projectKey=iamcaominhtien_kanban-board-mcp
sonar.projectName=Kanban Board MCP

# What is analysed: the Python server, the React UI and the Electron shell.
# design/ and docs/ (mockups, specs, the user guide) are left out.
sonar.sources=server,ui/src,desktop
sonar.tests=server/tests,ui/src,desktop/tests
sonar.exclusions=server/tests/**,server/uploads/**,desktop/tests/**,desktop/build/**,ui/src/**/*.test.ts,ui/src/**/*.test.tsx,**/node_modules/**,**/.venv/**
sonar.test.inclusions=server/tests/**,ui/src/**/*.test.ts,ui/src/**/*.test.tsx,desktop/tests/**

sonar.python.version=3.12

# Coverage reports made by the backend, frontend and desktop jobs (the sonar job points their paths at the checkout)
sonar.python.coverage.reportPaths=coverage-reports/coverage-server/coverage.xml
sonar.javascript.lcov.reportPaths=coverage-reports/coverage-ui/lcov.info,coverage-reports/coverage-desktop/lcov.info

# Alembic migrations are generated, one-off code: no coverage or duplication checks on them
sonar.coverage.exclusions=server/alembic/**,server/scripts/**
sonar.cpd.exclusions=server/alembic/**

# Findings that describe the feature itself, so they are not issues here (checked one by one, see PR #254):
#  e1  a developer script writes its CSV where its --out says
#  e2  the export CLI writes where its caller's --output says
#  e3  a sketch is exported to the folder the user chose
#  e4,e5  the MCP config of the project folder the user picked is read and written
#  e6  the agy profile's own fixed MCP config file (only its JSON content varies)
#  e7  config backups, in a folder checked by _safe_target and named by a timestamp
#  e8  proofs, read from inside the working folder and stored under a generated name
#  e9  log injection: app_logging indents any logged line that reads like a record of its own
#  e10 the bundled server binary is made executable (755)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=server/scripts/measure_ai_load.py
sonar.issue.ignore.multicriteria.e2.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.e2.resourceKey=desktop/export-svg.js
sonar.issue.ignore.multicriteria.e3.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e3.resourceKey=server/services/sketches.py
sonar.issue.ignore.multicriteria.e4.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e4.resourceKey=server/services/mcp_clients.py
sonar.issue.ignore.multicriteria.e5.ruleKey=pythonsecurity:S6549
sonar.issue.ignore.multicriteria.e5.resourceKey=server/services/mcp_clients.py
sonar.issue.ignore.multicriteria.e6.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e6.resourceKey=server/services/ai/profiles.py
sonar.issue.ignore.multicriteria.e7.ruleKey=pythonsecurity:S2083
