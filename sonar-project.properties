# SonarQube Cloud analysis, run once a night on main by the `sonar` job in .github/workflows/nightly-quality.yml.
# The keys are the ones SonarQube Cloud generates when the GitHub repository is imported.
sonar.organization=iamcaominhtien
sonar.projectKey=iamcaominhtien_kanban-board-mcp
sonar.projectName=Kanban Board MCP

# What is analysed: the Rust server (the Cargo workspace in server/), the React UI and the Electron shell.
# design/ and docs/ (mockups, specs, the user guide) are left out.
sonar.sources=server,ui/src,desktop
sonar.tests=server,ui/src,desktop/tests
sonar.exclusions=server/target*/**,server/**/tests/**,server/crates/testkit/**,server/crates/fake-claude/**,server/contract/**,desktop/tests/**,desktop/build/**,ui/src/**/*.test.ts,ui/src/**/*.test.tsx,**/node_modules/**
sonar.test.inclusions=server/**/tests/**,server/crates/testkit/**,server/crates/fake-claude/**,ui/src/**/*.test.ts,ui/src/**/*.test.tsx,desktop/tests/**

# Reports made by the nightly test jobs (the sonar job points the UI and desktop paths at the checkout):
#  - line coverage: the UI and the desktop shell (vitest/jest lcov), the Rust workspace (cargo-llvm-cov lcov, with
#    absolute paths under the same checkout folder);
#  - the clippy findings of the Rust workspace (`cargo clippy --message-format=json`, the compiler messages only, with
#    file names made relative to this folder). SonarQube Cloud imports them as external issues.
sonar.javascript.lcov.reportPaths=coverage-reports/coverage-ui/lcov.info,coverage-reports/coverage-desktop/lcov.info
sonar.rust.lcov.reportPaths=coverage-reports/coverage-server/lcov.info
sonar.rust.clippyReport.reportPaths=coverage-reports/coverage-server/clippy.json

# Findings that describe the feature itself, so they are not issues here (checked one by one, see PR #254; the ones
# for the Python server went with it in 5.0.0):
#  e2  the export CLI writes where its caller's --output says
#  e10 the bundled server binary is made executable (755)
#  e11,e12 the guarded open-path / open-external IPC in main-helpers.js: a path opens only if its type (and its
#          symlink target) is a plain document or the person confirms in a system dialog, never on a network share;
#          a URL only if it is http(s) or mailto. Sonar does not know these checks as sanitizers.
sonar.issue.ignore.multicriteria=e2,e10,e11,e12,n1,n2,n3,n4,s2
sonar.issue.ignore.multicriteria.e2.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.e2.resourceKey=desktop/export-svg.js
sonar.issue.ignore.multicriteria.e10.ruleKey=javascript:S2612
sonar.issue.ignore.multicriteria.e10.resourceKey=desktop/main.js
sonar.issue.ignore.multicriteria.e11.ruleKey=jssecurity:S2076
sonar.issue.ignore.multicriteria.e11.resourceKey=desktop/main-helpers.js
sonar.issue.ignore.multicriteria.e12.ruleKey=jssecurity:S5144
sonar.issue.ignore.multicriteria.e12.resourceKey=desktop/main-helpers.js
#  n1  the notifications panel is a non-modal side panel (an aside with role=dialog): it does not trap focus, the page
#      behind stays usable, Esc and an outside click close it. A native <dialog> would need a reset of its default
#      position, size, margin and border, and is not made for a panel that leaves the page interactive.
#  n2  a notification row also opens from a click on its body (and Enter/Space when focused). That is a mouse
#      shortcut for the row's own Open button; keyboard users have the J/K/Enter keys and the buttons, so the row is
#      not a tab stop on purpose (every row would add a stop before its real buttons).
sonar.issue.ignore.multicriteria.n1.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.n1.resourceKey=ui/src/components/notifications/NotificationPanel.tsx
sonar.issue.ignore.multicriteria.n2.ruleKey=typescript:S6848
sonar.issue.ignore.multicriteria.n2.resourceKey=ui/src/components/notifications/NotificationRow.tsx
#  n3,n4 the amber of the warning icons (toast warning, the day card's sun) is the design's #B8860B on #FEF3D9
#      (design/source/Notifications.dc.html): an icon beside its text, not text, so the 4.5:1 text contrast rule
#      does not apply to it.
sonar.issue.ignore.multicriteria.n3.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.n3.resourceKey=ui/src/components/Toast.module.css
sonar.issue.ignore.multicriteria.n4.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.n4.resourceKey=ui/src/components/notifications/DayCard.module.css

# Style rules this project does not follow, switched off where they apply:
#  s2  typescript:S6759 "React props should be read-only": the props are never mutated, and wrapping every props
#      type in Readonly<> adds noise to 800+ components without catching anything tsc and eslint do not.
sonar.issue.ignore.multicriteria.s2.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.s2.resourceKey=ui/src/**
