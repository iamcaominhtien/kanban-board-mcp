name: CI

# The fast gate a pull request waits for: lint, types, build and the tests, with no coverage and no SonarQube.
# Coverage (which doubles the backend's time) and the SonarQube Cloud analysis run once a night on main instead,
# in nightly-quality.yml, which also files what SonarQube found in a GitHub issue.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which parts a change touches, so a docs- or design-only change runs no tests. A job that is skipped this way
  # still counts as passed for a required check.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/changed-parts.sh

  # The backend tests run as three shards side by side (tests/conftest.py, KANBAN_TEST_SHARD), without coverage:
  # with coverage and two shards one shard took 4 to 6.5 minutes. Shard 1 also lints.
  backend-tests:
    name: Backend tests (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync
      - name: Lint (includes the docstring rules)
        if: matrix.shard == 1
        run: uv run ruff check .
      - name: Format
        if: matrix.shard == 1
        run: uv run ruff format --check .
      - name: Tests
        env:
          KANBAN_TEST_SHARD: ${{ matrix.shard }}/3
        run: uv run pytest -q -n auto --durations=15

  # The check that keeps its old name for branch protection: green only when lint and every shard passed
  backend:
    name: Backend (ruff, pytest)
    needs: [changes, backend-tests]
    if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.backend-tests.result }}" = success

  frontend:
    name: Frontend (prettier, eslint, tsc, build)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint (includes the JSDoc rule)
        run: npm run lint -- --max-warnings=40
      - name: Unit tests
        run: npm test
      - name: Typecheck and build
        run: npm run build

  desktop:
    name: Desktop (node tests)
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # --ignore-scripts: the tests need no Electron binary, so skip its download
      - run: npm ci --ignore-scripts
      - name: Tests
        run: npm test
