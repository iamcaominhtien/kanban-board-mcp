name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync
      - name: Lint (includes the docstring rules)
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests (with coverage for SonarQube Cloud)
        run: uv run pytest -q -n auto --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }} # the report is written even when a test fails
        with:
          name: coverage-server
          path: server/coverage.xml
          retention-days: 3

  frontend:
    name: Frontend (prettier, eslint, tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint (includes the JSDoc rule)
        run: npm run lint -- --max-warnings=40
      - name: Unit tests (with coverage for SonarQube Cloud)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }} # the report is written even when a test fails
        with:
          name: coverage-ui
          path: ui/coverage/lcov.info
          retention-days: 3
      - name: Typecheck and build
        run: npm run build

  desktop:
    name: Desktop (node tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # --ignore-scripts: the tests need no Electron binary, so skip its download
      - run: npm ci --ignore-scripts
      - name: Tests (with coverage for SonarQube Cloud)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }} # the report is written even when a test fails
        with:
          name: coverage-desktop
          path: desktop/lcov.info
          retention-days: 3

  # Code quality, security and coverage on SonarQube Cloud (config: sonar-project.properties).
  # Skipped while the SONAR_TOKEN secret is not set (and on PRs from forks, which do not get secrets).
  # Runs even when a test job fails, so one failing test does not leave main without an analysis.
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: [backend, frontend, desktop]
    if: ${{ !cancelled() }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0 # full history, so new code and blame are right
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with:
          pattern: coverage-*
          path: coverage-reports
      # The reports name files relative to server/, ui/ and desktop/; Sonar needs paths it can find from here
      - name: Point the coverage reports at the checkout
        if: env.SONAR_TOKEN != ''
        run: |
          # A report is missing when its job stopped before the tests ran; Sonar then goes without it
          f=coverage-reports/coverage-server/coverage.xml
          [ -f "$f" ] && sed -i "s#<source>.*</source>#<source>$GITHUB_WORKSPACE/server</source>#" "$f"
          f=coverage-reports/coverage-ui/lcov.info
          [ -f "$f" ] && sed -i "s#^SF:#SF:$GITHUB_WORKSPACE/ui/#" "$f"
          f=coverage-reports/coverage-desktop/lcov.info
          [ -f "$f" ] && sed -i "s#^SF:#SF:$GITHUB_WORKSPACE/desktop/#" "$f"
          true
      - uses: SonarSource/sonarqube-scan-action@v8
        if: env.SONAR_TOKEN != ''
