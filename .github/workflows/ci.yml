name: CI

# The fast gate a pull request waits for: lint, types, build and the tests, with no coverage and no SonarQube.
# Coverage (which doubles the backend's time) and the SonarQube Cloud analysis run once a night on main instead,
# in nightly-quality.yml, which also files what SonarQube found in a GitHub issue.
#
# Every part runs side by side: the backend (Rust: rustfmt and clippy, plus a type check on macOS and Windows), the UI's
# tests in 3, the UI's checks (prettier, eslint, tsc, build) in one job whose caches make an unchanged file cost
# nothing. The repository is public, so the extra jobs
# cost no Actions minutes. Each job checks out only the folders it needs (docs/ and design/ alone are 300 MB).

on:
  pull_request:
  push:
    branches: [main]

env:
  # The Rust workspace that holds the server. The one place this file names it: change this line when the folder is
  # renamed (the paths below read it; only the `changes` filter and the docs of the file repeat the name).
  SERVER_DIR: server
  # Keep equal to rust-version in <SERVER_DIR>/Cargo.toml
  RUST_TOOLCHAIN: "1.94"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # the list of changed files, read from the API instead of from a full clone

jobs:
  # Which parts a change touches, so a docs- or design-only change runs no tests. A job that is skipped this way
  # still counts as passed for a required check. A change to this workflow runs everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      # a pull request's files come from the API; a push to main compares with the commit before it, from git
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
      - id: diff
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - '${{ env.SERVER_DIR }}/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'ui/**'
              - 'CHANGELOG.md'
              - '.github/workflows/ci.yml'
            desktop:
              - 'desktop/**'
              - '.github/workflows/ci.yml'

  backend-lint:
    name: Backend lint (rustfmt, clippy)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            ${{ env.SERVER_DIR }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.SERVER_DIR }}/target
          key: cargo-lint-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles(format('{0}/Cargo.lock', env.SERVER_DIR)) }}
          restore-keys: cargo-lint-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Format
        working-directory: ${{ env.SERVER_DIR }}
        run: cargo fmt --all --check
      - name: Lint
        working-directory: ${{ env.SERVER_DIR }}
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The Rust code has branches that only compile on one system (the keychain, process handling, paths), so a type
  # check runs on macOS and Windows too. Only `cargo check`: no linking, no tests.
  backend-check:
    name: Backend check (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            ${{ env.SERVER_DIR }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.SERVER_DIR }}/target
          key: cargo-check-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles(format('{0}/Cargo.lock', env.SERVER_DIR)) }}
          restore-keys: cargo-check-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Check
        working-directory: ${{ env.SERVER_DIR }}
        run: cargo check --workspace --all-targets

  # The Rust tests. Some read server/ (the Python reference) and ui/, so those come along.
  backend-tests:
    name: Backend tests
    needs: changes
    # DISABLED: tests are turned off in CI. To turn them back on, restore the `if:` line below to the changes-based condition.
    # if: ${{ needs.changes.outputs.backend == 'true' }}
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            ${{ env.SERVER_DIR }}
            server
            ui
            desktop
            .claude
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.SERVER_DIR }}/target
          key: cargo-test-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles(format('{0}/Cargo.lock', env.SERVER_DIR)) }}
          restore-keys: cargo-test-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Tests
        working-directory: ${{ env.SERVER_DIR }}
        run: cargo test --workspace

  # The check that keeps its old name for branch protection: green when lint and the checks on every system passed
  backend:
    name: Backend (rustfmt, clippy)
    needs: [changes, backend-lint, backend-check, backend-tests]
    if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # backend-tests is disabled (skipped), so only lint and the checks are required; add a backend-tests line when tests return
      - name: Lint and checks passed
        run: |
          test "${{ needs.backend-lint.result }}" = success
          test "${{ needs.backend-check.result }}" = success

  # The board on PostgreSQL and MySQL/MariaDB: the data layer's tests (kb-db, kb-dbkit) run against a PostgreSQL and a
  # MariaDB container. They skip a server whose URL variable is not set.
  databases:
    name: Databases (PostgreSQL, MariaDB)
    needs: changes
    # DISABLED: tests are turned off in CI. To turn them back on, restore the `if:` line below to the changes-based condition.
    # if: ${{ needs.changes.outputs.backend == 'true' }}
    if: false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kanban
          # a throwaway password made per run (the containers live for this job only)
          POSTGRES_PASSWORD: ${{ github.run_id }}-db
          POSTGRES_DB: kanban
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kanban" --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_USER: kanban
          MARIADB_PASSWORD: ${{ github.run_id }}-db
          MARIADB_DATABASE: kanban
          MARIADB_ROOT_PASSWORD: ${{ github.run_id }}-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      # server/ (the Python reference) comes along for the tests that compare with it
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.SERVER_DIR }}/target
          key: cargo-test-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles(format('{0}/Cargo.lock', env.SERVER_DIR)) }}
          restore-keys: cargo-test-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Data layer tests on PostgreSQL and MariaDB
        working-directory: ${{ env.SERVER_DIR }}
        env:
          KANBAN_TEST_POSTGRES_URL: postgresql://kanban:${{ github.run_id }}-db@127.0.0.1:5432/kanban
          KANBAN_TEST_MYSQL_URL: mysql://kanban:${{ github.run_id }}-db@127.0.0.1:3306/kanban
        run: cargo test -p kb-db -p kb-dbkit

  # prettier, eslint and tsc keep their caches between runs (keyed by commit, restored from the newest one this
  # branch or main made): a file that did not change is not checked again. prettier and eslint cache by content, so
  # a fresh checkout's new timestamps do not count as changes; tsc's own incremental build info does the same.
  frontend-checks:
    name: Frontend checks (prettier, eslint, tsc, build)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      CACHE_DIR: ${{ github.workspace }}/.ui-ci-cache
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .ui-ci-cache
          key: ui-checks-${{ hashFiles('ui/package-lock.json') }}-${{ github.sha }}
          restore-keys: ui-checks-${{ hashFiles('ui/package-lock.json') }}-
      - run: npm ci && mkdir -p "$CACHE_DIR"
      - name: Format
        run: npx prettier --check src --cache --cache-strategy content --cache-location "$CACHE_DIR/prettier"
      - name: Lint (includes the JSDoc rule)
        run: >-
          npx eslint src --max-warnings=40
          --cache --cache-strategy content --cache-location "$CACHE_DIR/eslint"
      - name: Typecheck
        run: npx tsc -p . --incremental --tsBuildInfoFile "$CACHE_DIR/tsbuildinfo"
      - name: Build
        run: npx vite build

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }}/3)
    needs: changes
    # DISABLED: tests are turned off in CI. To turn them back on, restore the `if:` line below to the changes-based condition.
    # if: ${{ needs.changes.outputs.frontend == 'true' }}
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx vitest run --shard=${{ matrix.shard }}/3

  # The check that keeps its old name for branch protection
  frontend:
    name: Frontend (prettier, eslint, tsc, build)
    needs: [changes, frontend-checks, frontend-tests]
    if: ${{ !cancelled() && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # frontend-tests is disabled (skipped), so only the checks are required; re-add the frontend-tests line when tests return
      - name: Checks passed
        run: |
          test "${{ needs.frontend-checks.result }}" = success

  desktop:
    name: Desktop (node tests)
    needs: changes
    # DISABLED: tests are turned off in CI. To turn them back on, restore the `if:` line below to the changes-based condition.
    # if: ${{ needs.changes.outputs.desktop == 'true' }}
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            desktop
            ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # --ignore-scripts: the tests need no Electron binary, so skip its download (ui/ is checked out because some
      # tests read the UI's shortcuts and notification sound)
      - run: npm ci --ignore-scripts
      - name: Tests
        run: npm test
