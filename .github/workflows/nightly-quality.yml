name: Nightly quality

# Once a night on main: every test with coverage, the SonarQube Cloud analysis (config: sonar-project.properties),
# then sonar-digest.py files the result in one GitHub issue labelled `sonarqube` and comments when new issues
# appear. Pull requests wait only for the fast checks in ci.yml.
#
# A night with no new commit on main is skipped (SonarQube already analysed that commit). Run it by hand from the
# Actions tab ("Run workflow"); tick "force" to analyse again anyway.

# DISABLED: the nightly schedule is turned off (tests and SonarQube no longer run on their own). It can still be run
# by hand. To turn it back on, restore the schedule below.
on:
  # schedule:
  #   - cron: "17 19 * * *" # 02:17 in Vietnam (UTC+7)
  workflow_dispatch:
    inputs:
      force:
        description: Run even when SonarQube Cloud already analysed main's latest commit
        type: boolean
        default: false

concurrency:
  group: nightly-quality
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The Rust workspace that holds the server. The one place this file names it: change this line when the folder is
  # renamed (the paths below read it).
  SERVER_DIR: server
  # Keep equal to rust-version in <SERVER_DIR>/Cargo.toml
  RUST_TOOLCHAIN: "1.94"

jobs:
  # Skipped when the SONAR_TOKEN secret is not set, or (on the schedule) when nothing reached main since the last
  # analysis
  check:
    name: Anything to analyse
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::No SONAR_TOKEN secret: nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          key=$(sed -n 's/^sonar.projectKey=//p' sonar-project.properties)
          last=$(curl -sf -H "Authorization: Bearer $SONAR_TOKEN" \
            "https://sonarcloud.io/api/project_branches/list?project=$key" \
            | python3 -c 'import json,sys; print(next((b.get("commit",{}).get("sha","") for b in json.load(sys.stdin)["branches"] if b.get("isMain")), ""))' \
            || true)
          echo "main is at $GITHUB_SHA, SonarQube last analysed ${last:-nothing}"
          if [ "$last" = "$GITHUB_SHA" ] && [ "$FORCE" != "true" ]; then
            echo "::notice::SonarQube Cloud already analysed $GITHUB_SHA: skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Line coverage of the Rust workspace (cargo-llvm-cov), written as lcov. The tests that need PostgreSQL or MariaDB
  # skip themselves here (no URL variable); `ci.yml`'s databases job covers them.
  backend:
    name: Backend tests with coverage
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      # ui/ and desktop/ come along: some Rust tests read them
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview, clippy
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.SERVER_DIR }}/target
          key: cargo-cov-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles(format('{0}/Cargo.lock', env.SERVER_DIR)) }}
          restore-keys: cargo-cov-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Tests with coverage
        working-directory: ${{ env.SERVER_DIR }}
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      # Every clippy finding for SonarQube (ci.yml is the gate that fails on them): the compiler messages only, as
      # `cargo clippy --message-format=json` writes them
      - name: Clippy report
        if: ${{ !cancelled() }}
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          cargo clippy --workspace --all-targets --message-format=json \
            | jq -c 'select(.reason == "compiler-message")' > clippy.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }} # the report is written even when a test fails
        with:
          name: coverage-server
          path: |
            ${{ env.SERVER_DIR }}/lcov.info
            ${{ env.SERVER_DIR }}/clippy.json
          retention-days: 3

  frontend:
    name: Frontend tests with coverage
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-ui
          path: ui/coverage/lcov.info
          retention-days: 3

  desktop:
    name: Desktop tests with coverage
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-desktop
          path: desktop/lcov.info
          retention-days: 3

  # Runs even when a test job fails, so one failing test does not leave main without an analysis; the report
  # issue then says which tests failed
  sonar:
    name: SonarQube Cloud and the report issue
    needs: [check, backend, frontend, desktop]
    if: ${{ !cancelled() && needs.check.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the report issue
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so new code and blame are right
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports
      # The reports name files relative to ui/ and desktop/ (the Rust one is absolute); Sonar needs paths it can find from here
      - name: Point the coverage reports at the checkout
        run: |
          # A report is missing when its job stopped before the tests ran; Sonar then goes without it
          # (the Rust report from cargo-llvm-cov already holds absolute paths, under the same workspace folder)
          f=coverage-reports/coverage-ui/lcov.info
          [ -f "$f" ] && sed -i "s#^SF:#SF:$GITHUB_WORKSPACE/ui/#" "$f"
          f=coverage-reports/coverage-desktop/lcov.info
          [ -f "$f" ] && sed -i "s#^SF:#SF:$GITHUB_WORKSPACE/desktop/#" "$f"
          # clippy names files relative to the workspace (crates/..., bins/...); Sonar reads them from the repository root
          f=coverage-reports/coverage-server/clippy.json
          [ -f "$f" ] && sed -i -E "s#\"file_name\":\"(crates|bins)/#\"file_name\":\"$SERVER_DIR/\\1/#g" "$f"
          true
      - uses: SonarSource/sonarqube-scan-action@v8
      # Last night's issue keys, so the report can tell what is new (the newest cache whose key starts like this)
      - uses: actions/cache/restore@v4
        with:
          path: sonar-state
          key: sonar-issue-keys-${{ github.run_id }}
          restore-keys: sonar-issue-keys-
      - name: File the result in the report issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTS_SUMMARY: >-
            backend ${{ needs.backend.result }} · frontend ${{ needs.frontend.result }} ·
            desktop ${{ needs.desktop.result }}
        run: >-
          python3 .github/scripts/sonar-digest.py
          --previous-keys sonar-state/keys.txt --keys-out sonar-state/keys.txt
      - uses: actions/cache/save@v4
        with:
          path: sonar-state
          key: sonar-issue-keys-${{ github.run_id }}
