<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #EEF3EF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    @keyframes shimmer {
      0% { background-position: -200px 0; }
      100% { background-position: 200px 0; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .skel {
      background: linear-gradient(90deg, #EEF3EF 25%, #F6FAF7 37%, #EEF3EF 63%);
      background-size: 400px 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 6px;
    }
  </style>
</helmet>

<div style="width: 960px; height: 520px; box-sizing: border-box; padding: 64px; background: #FFFFFF; display: flex; flex-direction: column; gap: 32px; color: #1E2A22;">

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #68BA7F;">Component</div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; color: #1E2A22;">Loading States</h1>
    <div style="font-size: 14px; color: #5B6B60;">Skeleton cards while a column loads, spinner for full-page and button states.</div>
  </div>

  <div style="display: flex; gap: 40px; flex-grow: 1;">

    <!-- Skeleton column -->
    <div style="display: flex; flex-direction: column; gap: 10px; width: 280px;">
      <div style="font-size: 12px; font-weight: 600; color: #5B6B60;">Column skeleton</div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="width: 280px; height: 120px; border-radius: 12px; border: 1px solid #DCE6DF; box-sizing: border-box; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
          <div class="skel" style="width: 64px; height: 10px;"></div>
          <div class="skel" style="width: 90px; height: 16px; border-radius: 999px;"></div>
          <div class="skel" style="width: 100%; height: 12px;"></div>
          <div class="skel" style="width: 70%; height: 12px;"></div>
        </div>
        <div style="width: 280px; height: 120px; border-radius: 12px; border: 1px solid #DCE6DF; box-sizing: border-box; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; opacity: 0.75;">
          <div class="skel" style="width: 64px; height: 10px;"></div>
          <div class="skel" style="width: 90px; height: 16px; border-radius: 999px;"></div>
          <div class="skel" style="width: 100%; height: 12px;"></div>
          <div class="skel" style="width: 55%; height: 12px;"></div>
        </div>
      </div>
    </div>

    <!-- Full page spinner -->
    <div style="display: flex; flex-direction: column; gap: 10px; width: 220px;">
      <div style="font-size: 12px; font-weight: 600; color: #5B6B60;">Full-page spinner</div>
      <div style="flex-grow: 1; border-radius: 12px; background: #F6FAF7; border: 1px solid #DCE6DF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 240px;">
        <div style="width: 36px; height: 36px; border-radius: 50%; border: 3px solid #DCE6DF; border-top-color: #2E6F40; animation: spin 0.8s linear infinite;"></div>
        <div style="font-size: 13px; font-weight: 500; color: #5B6B60;">Loading board…</div>
      </div>
    </div>

    <!-- Button loading state -->
    <div style="display: flex; flex-direction: column; gap: 10px; width: 220px;">
      <div style="font-size: 12px; font-weight: 600; color: #5B6B60;">Button states</div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button style="font-family: inherit; border: none; cursor: pointer; padding: 10px 18px; border-radius: 10px; background: #2E6F40; color: #FFFFFF; font-size: 14px; font-weight: 600;">Save changes</button>
        <button style="font-family: inherit; border: none; padding: 10px 18px; border-radius: 10px; background: #2E6F40; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; opacity: 0.8;">
          <span style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); border-top-color: #FFFFFF; animation: spin 0.7s linear infinite;"></span>
          Saving…
        </button>
        <button style="font-family: inherit; border: 1px solid #DCE6DF; padding: 10px 18px; border-radius: 10px; background: #F6FAF7; color: #B7C4BC; font-size: 14px; font-weight: 600;" disabled="">Disabled</button>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":960,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
