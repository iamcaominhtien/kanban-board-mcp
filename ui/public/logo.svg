<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="16%" y1="0%" x2="84%" y2="100%">
      <stop offset="0%" stop-color="#2E6F40"/>
      <stop offset="100%" stop-color="#1E4A2C"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- App Tile Background -->
  <rect width="120" height="120" rx="26" fill="url(#bgGrad)"/>

  <!-- 1. White Card in the BACK with the 2 lines (#B7D9C0) -->
  <g filter="url(#cardShadow)">
    <rect x="31" y="39" width="58" height="42" rx="8" fill="#F3F8F4"/>
    <rect x="39" y="51" width="26" height="5" rx="2.5" fill="#B7D9C0"/>
    <rect x="39" y="61" width="40" height="5" rx="2.5" fill="#B7D9C0"/>
  </g>

  <!-- 2. Translucent Card in FRONT: background #1E4A2C, opacity 0.55, rotated -9deg -->
  <rect x="31" y="39" width="58" height="42" rx="8" fill="#1E4A2C" opacity="0.55" transform="rotate(-9 60 60) translate(-6, 5)"/>
</svg>